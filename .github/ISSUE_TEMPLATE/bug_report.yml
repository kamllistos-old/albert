name: Bug report
description: Something in Albert doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Albert version
      description: Output of `albert version`
      placeholder: albert 0.1.0
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `albert doctor`
      render: text
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 26.1, Apple M3
  - type: textarea
    id: log
    attributes:
      label: Relevant lines from ~/.albert/albert.log (optional)
      render: text
