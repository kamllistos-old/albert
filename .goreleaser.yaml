# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: albert

builds:
  - id: albert
    main: ./cmd/albert
    binary: albert
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

# Archive names are albert_darwin_arm64.tar.gz and albert_darwin_amd64.tar.gz.
# install.sh downloads exactly these names, so change both together.
archives:
  - id: albert
    formats:
      - tar.gz
    name_template: "albert_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  disable: true

# Homebrew: `brew install kamllistos/tap/albert`. Publishes the cask to the
# kamllistos/homebrew-tap repo. Needs the HOMEBREW_TAP_GITHUB_TOKEN secret (a
# token that can push to that repo); without it the release still succeeds and
# just skips the tap update.
homebrew_casks:
  - name: albert
    ids:
      - albert
    binaries:
      - albert
    homepage: "https://github.com/kamllistos/albert"
    description: "See, update and install every dev tool on your Mac in one place"
    repository:
      owner: kamllistos
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # release.yml always defines this variable (empty when the secret is unset).
    skip_upload: '{{ if eq .Env.HOMEBREW_TAP_GITHUB_TOKEN "" }}true{{ end }}'
    commit_msg_template: "albert {{ .Tag }}"
    caveats: |
      Start Albert with:   albert up
      Stop it with:        albert down
      Remove it with:      albert uninstall --yes; brew uninstall albert
    # `brew uninstall --zap albert` also moves Albert's settings folder to the Trash.
    zap:
      trash:
        - "~/.albert"
    # The binary isn't signed by Apple, so clear the download quarantine flag.
    # Homebrew's declarative postflight_steps (the Ruby postflight block is
    # deprecated). must_succeed: false because xattr exits non-zero when the
    # quarantine flag isn't there, which would otherwise abort the install.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/albert"], must_succeed: false
          end
