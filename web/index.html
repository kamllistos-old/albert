<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Albert</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a6cff'/%3E%3Cpath d='M9 23l7-14 7 14M11.5 18h9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">A</span>
      <h1>Albert</h1>
    </div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" id="tab-installed" aria-controls="view-installed" aria-selected="true" class="tab">Installed</button>
      <button type="button" role="tab" id="tab-install" aria-controls="view-install" aria-selected="false" class="tab" tabindex="-1">Install new</button>
    </nav>
    <div class="search" id="filter-wrap">
      <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
      <input type="search" id="filter" placeholder="Filter your tools" aria-label="Filter your installed tools" autocomplete="off" spellcheck="false">
    </div>
    <div class="actions">
      <span class="checking" id="checking" role="status" hidden><span class="spinner" aria-hidden="true"></span>Checking for updates…</span>
      <button type="button" class="btn" id="refresh" title="Look for tools and updates again" aria-label="Refresh">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M12.5 1.5v3h-3"/></svg>
        <span>Refresh</span>
      </button>
      <button type="button" class="btn btn-primary" id="update-all" disabled>Update all (0)</button>
    </div>
  </header>

  <div class="notice" id="notice" role="alert" hidden></div>

  <main>
    <section id="view-installed" role="tabpanel" aria-labelledby="tab-installed">
      <div class="toolbar">
        <p class="summary" id="summary" aria-live="polite"></p>
        <label class="switch">
          <input type="checkbox" id="show-deps">
          <span class="switch-track" aria-hidden="true"></span>
          <span>Show dependencies</span>
        </label>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter by source"></div>
      <p class="source-note" id="source-note" hidden></p>
      <div class="card" id="table"></div>
    </section>

    <section id="view-install" role="tabpanel" aria-labelledby="tab-install" hidden></section>
  </main>

  <aside class="detail" id="detail" aria-labelledby="detail-name" hidden>
    <div class="detail-head">
      <div>
        <h2 id="detail-name"></h2>
        <p class="detail-source" id="detail-source"></p>
      </div>
      <button type="button" class="icon-btn" id="detail-close" aria-label="Close details">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div id="detail-badge"></div>
    <p class="detail-desc" id="detail-desc"></p>
    <dl class="detail-facts">
      <dt>Installed version</dt><dd class="mono" id="detail-version"></dd>
      <dt>Latest version</dt><dd class="mono" id="detail-latest"></dd>
      <dt>Website</dt><dd id="detail-home"></dd>
      <dt>Location on your Mac</dt><dd class="mono path" id="detail-path"></dd>
    </dl>
    <p class="detail-hint" id="detail-hint" hidden></p>
    <div class="detail-actions">
      <button type="button" class="btn btn-primary" id="detail-update">Update</button>
      <button type="button" class="btn btn-danger" id="detail-delete">Delete</button>
    </div>
  </aside>

  <footer class="drawer" id="jobs" hidden></footer>
</div>

<div class="session" id="session" hidden>
  <div class="session-card" role="alertdialog" aria-modal="true" aria-labelledby="session-text">
    <span class="session-mark" aria-hidden="true">A</span>
    <p id="session-text">Albert's session ended. Run "albert up" in Terminal to open it again.</p>
  </div>
</div>

<dialog class="confirm" id="confirm" aria-labelledby="confirm-title">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text"></p>
    <div class="confirm-actions">
      <button type="submit" class="btn" value="cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" value="ok" id="confirm-ok"></button>
    </div>
  </form>
</dialog>

<div class="sr-only" id="announce" aria-live="polite"></div>
</body>
</html>
